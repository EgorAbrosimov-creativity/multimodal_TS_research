name: film_fusion_ettm1_pred96
description: FiLM Fusion (text generates gamma/beta for PatchTST features) on ETTm1, pred_len=96
# GPU REQUIRED — connect Colab GPU runtime via VSCode extension before running

model:
  name: FiLMFusion
  task_name: long_term_forecast
  enc_in: 7
  seq_len: 512
  label_len: 48
  pred_len: 96
  d_model: 128
  n_heads: 16
  e_layers: 3
  d_layers: 1
  d_ff: 768
  factor: 1
  dropout: 0.2
  activation: gelu
  text_hidden: 768

data:
  dataset: ETTm1
  root_path: ./dataset/ETT-small/
  data_path: ETTm1.csv
  features: M
  target: OT
  freq: t

training:
  train_epochs: 15
  batch_size: 32
  learning_rate: 0.001
  patience: 5
  seed: 2024

compute:
  gpu: 0
  num_workers: 4
  use_amp: false
