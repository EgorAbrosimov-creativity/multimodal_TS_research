name: patchtst_ettm2_pred96
description: PatchTST backbone on ETTm2, pred_len=96

model:
  name: PatchTST
  task_name: long_term_forecast
  enc_in: 7
  seq_len: 512
  label_len: 48
  pred_len: 96
  d_model: 128
  n_heads: 16
  e_layers: 3
  d_layers: 1
  d_ff: 768
  factor: 1
  dropout: 0.2
  activation: gelu

data:
  dataset: ETTm2
  root_path: ./dataset/ETT-small/
  data_path: ETTm2.csv
  features: M
  target: OT
  freq: t

training:
  train_epochs: 15
  batch_size: 128
  learning_rate: 0.0001
  patience: 5
  seed: 2024

compute:
  gpu: 0
  num_workers: 4
  use_amp: false
