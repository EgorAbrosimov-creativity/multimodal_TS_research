name: ensemble_fusion_etth1_pred96
description: Ensemble Fusion (text-predicted α blends PatchTST + text MLP) on ETTh1, pred_len=96
# GPU REQUIRED — connect Colab GPU runtime via VSCode extension before running

model:
  name: EnsembleFusion
  task_name: long_term_forecast
  enc_in: 7
  seq_len: 512
  label_len: 48
  pred_len: 96
  d_model: 128
  n_heads: 16
  e_layers: 3
  d_layers: 1
  d_ff: 768
  factor: 1
  dropout: 0.2
  activation: gelu
  text_model: bert-base-uncased   # swap to google/flan-t5-small or sentence-transformers/all-MiniLM-L6-v2

data:
  dataset: ETTh1
  root_path: ./dataset/ETT-small/
  data_path: ETTh1.csv
  features: M
  target: OT
  freq: h

training:
  train_epochs: 15
  batch_size: 32
  learning_rate: 0.001
  patience: 5
  seed: 2024

compute:
  gpu: 0
  num_workers: 4
  use_amp: false
