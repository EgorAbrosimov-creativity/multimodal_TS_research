name: patchtst_weather_pred96
description: PatchTST backbone on Weather, pred_len=96

model:
  name: PatchTST
  task_name: long_term_forecast
  enc_in: 21
  seq_len: 512
  label_len: 48
  pred_len: 96
  d_model: 128
  n_heads: 16
  e_layers: 3
  d_layers: 1
  d_ff: 768
  factor: 1
  dropout: 0.2
  activation: gelu

data:
  dataset: custom
  root_path: ./dataset/weather/
  data_path: weather.csv
  features: M
  target: OT
  freq: h

training:
  train_epochs: 15
  batch_size: 128
  learning_rate: 0.0001
  patience: 5
  seed: 2024

compute:
  gpu: 0
  num_workers: 4
  use_amp: false
