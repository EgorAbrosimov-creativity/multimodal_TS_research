name: bert_forecaster_weather_pred96
description: Text-only BERT forecaster on Weather, pred_len=96 (GPU required)
# GPU REQUIRED — connect Colab GPU runtime via VSCode extension before running

model:
  name: BERTForecaster
  task_name: long_term_forecast
  enc_in: 21
  seq_len: 512
  label_len: 48
  pred_len: 96
  text_hidden: 768   # BERT hidden size (fixed)
  dropout: 0.1
  # unused fields kept for namespace compatibility
  d_model: 128
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 768
  factor: 1
  activation: gelu
  moving_avg: 25
  individual: false

data:
  dataset: custom
  root_path: ./dataset/weather/
  data_path: weather.csv
  features: M
  target: OT
  freq: h

training:
  train_epochs: 15
  batch_size: 32
  learning_rate: 0.001
  patience: 5
  seed: 2024

compute:
  gpu: 0
  num_workers: 4
  use_amp: false
